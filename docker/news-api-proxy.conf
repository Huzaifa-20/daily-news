# Shared settings for the upstream news API proxies (included per location,
# because nginx drops inherited proxy_set_header values once a location sets its own).

# Send the upstream hostname via SNI; the APIs sit behind shared CDNs.
proxy_ssl_server_name on;

# Present requests as server-to-server: NewsAPI's free tier rejects browser
# origins other than localhost, and upstreams have no use for our cookies.
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header Cookie "";
proxy_hide_header Set-Cookie;

proxy_connect_timeout 5s;
proxy_read_timeout 15s;
